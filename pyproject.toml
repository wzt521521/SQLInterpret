[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidbms"
version = "0.1.0"
description = "A teaching-oriented MiniDBMS for the Large-Scale Platform Software Design practicum."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
minidb = "minidbms.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["minidbms.sql_compiler.native*"]

[tool.setuptools.package-data]
"minidbms.sql_compiler" = ["native/CMakeLists.txt", "native/build.ps1", "native/app/*.cc", "native/app/*.h", "native/include/minisql/*.h", "native/src/*.cc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
