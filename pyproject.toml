[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidbms"
version = "0.2.0"
description = "A C++17 teaching-oriented MiniDBMS with a thin Python web adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
minidb = "minidbms.native_cli:main"
minidb-web = "minidbms.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["minidbms.sql_compiler.native*"]

[tool.setuptools.package-data]
"minidbms.sql_compiler" = ["native/CMakeLists.txt", "native/build.ps1", "native/app/*.cc", "native/app/*.h", "native/include/minisql/*.h", "native/src/*.cc"]
"minidbms.web" = ["static/*.html", "static/*.css", "static/*.js", "sql_examples/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
